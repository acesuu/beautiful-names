<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%231d6b57%22/%3E%3Ctext x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22serif%22%3E%D9%84%D9%84%D9%87%3C/text%3E%3C/svg%3E">
  <title>Allaah's Beautiful Names: Memorizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-ar" lang="ar">الأسماء الحسنى</span>
      <span class="brand-en">Beautiful Names Memorizer</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="today">Today</button>
      <button data-view="review">Review <span class="pill" id="dueBadge" hidden></span></button>
      <button data-view="quiz">Quiz</button>
      <button data-view="browse">All Names</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="auth-area" id="authArea"></div>
  </header>

  <main id="app"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="foot">
    Content: <em>A Summarized Explanation of Allaah's Beautiful Names</em>, Shaykh 'AbdurRazzaaq al-Badr
    (trans. Umm 'AbdirRahmaan Tara Hashim).
  </footer>

  <script src="data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
