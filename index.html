<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d6b57">
  <meta name="description" content="Memorize Allaah's Beautiful Names with daily goals, flashcards, spaced review and progress tracking.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Beautiful Names">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Allaah's Beautiful Names: Memorizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#dashboard">
      <span class="brand-ar" lang="ar">الأسماء الحسنى</span>
      <span class="brand-en">Beautiful Names Memorizer</span>
    </a>
    <nav class="tabs" id="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="today">Today</button>
      <button data-view="review">Review <span class="pill" id="dueBadge" hidden></span></button>
      <button data-view="quiz">Quiz</button>
      <button data-view="browse">All Names</button>
      <button data-view="leaderboard">Leaderboard</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="auth-area" id="authArea"></div>
    <a class="icon-btn mobile-only" href="#leaderboard" aria-label="Leaderboard" data-view-link="leaderboard">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
    </a>
    <a class="icon-btn mobile-only" href="#settings" aria-label="Settings" data-view-link="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <main id="app"></main>

  <!-- bottom tab bar (phones) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Main">
    <button data-view="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
    </button>
    <button data-view="today">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.3 2.3L15.5 13"/></svg><span>Today</span>
    </button>
    <button data-view="review">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg><span>Review</span><i class="nav-dot" id="dueDot" hidden></i>
    </button>
    <button data-view="quiz">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg><span>Quiz</span>
    </button>
    <button data-view="browse">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg><span>Names</span>
    </button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="foot">
    Content: <em>A Summarized Explanation of Allaah's Beautiful Names</em>, Shaykh 'AbdurRazzaaq al-Badr
    (trans. Umm 'AbdirRahmaan Tara Hashim).
  </footer>

  <script src="data.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="cloud.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then((reg) => reg.update())
        .catch(() => {});
      // when a new version of the app takes over, reload once so the update shows immediately
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
    }
  </script>
</body>
</html>
